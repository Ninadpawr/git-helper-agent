<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHelper – fix Git &amp; GitHub errors</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
<style>
:root{
  --bg:#eef1f4; --panel:#ffffff; --ink:#1d2733; --muted:#5d6b7a; --line:#d6dde4;
  --accent:#3b5bdb; --accent-ink:#ffffff; --add:#1a7f4b; --del:#c43b3b;
  --code-bg:#1d2733; --code-ink:#e6edf3; --user:#dfe6fb;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#12171d; --panel:#1a212a; --ink:#e4e9ee; --muted:#93a1b0; --line:#2b3541;
    --accent:#7d96f5; --accent-ink:#10151c; --add:#4cc38a; --del:#f0786f;
    --code-bg:#0d1217; --code-ink:#e6edf3; --user:#26325a;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 "IBM Plex Sans",system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:18px;font-weight:600;margin:0;flex:1}
header small{color:var(--muted);font-weight:400;margin-left:8px}
button{font:inherit;cursor:pointer}
.ghost{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:6px 12px}
.ghost:hover{color:var(--ink);border-color:var(--muted)}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{flex:1;overflow-y:auto;padding:24px 16px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.msg{padding:12px 16px;border-radius:12px;max-width:100%;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--user);border-bottom-right-radius:3px;white-space:pre-wrap}
.msg.bot{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:3px}
.msg.bot>*:first-child{margin-top:0}.msg.bot>*:last-child{margin-bottom:0}
.msg code{font-family:"JetBrains Mono",monospace;font-size:.88em}
.msg :not(pre)>code{background:var(--bg);padding:1px 5px;border-radius:4px}
pre{position:relative;background:var(--code-bg);color:var(--code-ink);border-radius:8px;padding:14px 16px;overflow-x:auto;margin:10px 0;border-left:3px solid var(--add)}
pre code{background:none!important;padding:0!important}
pre .copy{position:absolute;top:6px;right:6px;background:#ffffff1a;color:var(--code-ink);border:0;border-radius:6px;padding:2px 9px;font-size:12px}
pre .copy:hover{background:#ffffff33}
.empty{padding:32px 0 8px}
.empty h2{font-size:26px;line-height:1.25;margin:0 0 6px;font-weight:600}
.empty p{color:var(--muted);margin:0 0 20px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:7px 14px;font-size:14px;text-align:left}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip i{font-style:normal;font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--del);margin-right:6px}
footer{background:var(--panel);border-top:1px solid var(--line);padding:12px 16px}
form{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:flex-end}
textarea{flex:1;resize:none;max-height:160px;padding:10px 12px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px}
.send{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:10px 20px;font-weight:600}
.send:disabled{opacity:.5;cursor:not-allowed}
.dots span{display:inline-block;width:6px;height:6px;margin-right:4px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dots span{animation:none}}
</style>
</head>
<body>
<header>
  <h1>GitHelper<small>Git &amp; GitHub help, any hour</small></h1>
  <button class="ghost" id="clear" type="button">New chat</button>
</header>

<main id="main"><div class="wrap" id="chat"></div></main>

<footer>
  <form id="form">
    <textarea id="input" rows="1" placeholder="Paste your error or ask a Git question…" aria-label="Message"></textarea>
    <button class="send" id="send" type="submit">Send</button>
  </form>
</footer>

<script>
const chat = document.getElementById('chat');
const main = document.getElementById('main');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');

// --- anonymous session id (kept in this browser) ---
function makeId(){
  if (crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random()*16|0; return (c==='x'?r:(r&3|8)).toString(16);
  });
}
let sid = null;
try { sid = localStorage.getItem('gh_sid'); } catch(e){}
if (!sid){ sid = makeId(); try { localStorage.setItem('gh_sid', sid); } catch(e){} }

const STARTERS = [
  ['rejected','! [rejected] main -> main (fetch first)'],
  ['auth','Authentication failed when pushing'],
  ['conflict','Merge conflict – how do I fix it?'],
  ['first push','Push my local project to a new GitHub repo, step by step'],
  ['undo','Undo my last commit without losing changes'],
];

function render(el, text){
  el.innerHTML = DOMPurify.sanitize(marked.parse(text, {breaks:false}));
  el.querySelectorAll('pre').forEach(pre => {
    if (pre.querySelector('.copy')) return;
    const b = document.createElement('button');
    b.className = 'copy'; b.type = 'button'; b.textContent = 'Copy';
    b.onclick = () => {
      navigator.clipboard.writeText(pre.querySelector('code').innerText).then(() => {
        b.textContent = 'Copied'; setTimeout(() => b.textContent = 'Copy', 1400);
      });
    };
    pre.appendChild(b);
  });
}
function add(role, text){
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  if (role === 'bot') render(d, text); else d.textContent = text;
  chat.appendChild(d);
  main.scrollTop = main.scrollHeight;
  return d;
}
function showEmpty(){
  chat.innerHTML = '';
  const e = document.createElement('div');
  e.className = 'empty';
  e.innerHTML = '<h2>Stuck on a Git or GitHub error?</h2><p>Paste the error message or describe what you want to do. You get exact commands, one step at a time.</p><div class="chips"></div>';
  const chips = e.querySelector('.chips');
  STARTERS.forEach(([tag, q]) => {
    const c = document.createElement('button');
    c.type = 'button'; c.className = 'chip';
    c.innerHTML = '<i></i><span></span>';
    c.querySelector('i').textContent = tag;
    c.querySelector('span').textContent = q;
    c.onclick = () => send(q);
    chips.appendChild(c);
  });
  chat.appendChild(e);
}

async function loadHistory(){
  try {
    const r = await fetch('/api/history?sid=' + encodeURIComponent(sid));
    const data = await r.json();
    if (!data.messages.length) return showEmpty();
    chat.innerHTML = '';
    data.messages.forEach(m => add(m.role === 'user' ? 'user' : 'bot', m.content));
  } catch(e){ showEmpty(); }
}

async function send(text){
  text = (text || '').trim();
  if (!text || sendBtn.disabled) return;
  const empty = chat.querySelector('.empty'); if (empty) empty.remove();
  add('user', text);
  input.value = ''; input.style.height = 'auto';
  sendBtn.disabled = true;
  const bot = add('bot', '');
  bot.innerHTML = '<span class="dots"><span></span><span></span><span></span></span>';
  try {
    const res = await fetch('/api/chat', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({session_id: sid, message: text})
    });
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let acc = '';
    while (true){
      const {done, value} = await reader.read();
      if (done) break;
      acc += dec.decode(value, {stream:true});
      render(bot, acc);
      main.scrollTop = main.scrollHeight;
    }
    if (!acc) bot.textContent = 'No response. Please try again.';
  } catch(e){
    bot.textContent = 'Could not reach the server. Check your connection and try again.';
  }
  sendBtn.disabled = false;
  input.focus();
}

document.getElementById('form').addEventListener('submit', e => { e.preventDefault(); send(input.value); });
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(input.value); }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 160) + 'px';
});
document.getElementById('clear').onclick = async () => {
  await fetch('/api/clear', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({session_id: sid})});
  showEmpty();
};

loadHistory();
</script>
</body>
</html>
